openapi: 3.1.0
info:
  title: SideQuest Participation API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /quests/{id}/join:
    post:
      summary: Join a published quest, or return the existing enrollment
      description: No request body or If-Match. Creators cannot enroll. Existing enrollments survive archive and completion. No XP is awarded. Responses use Cache-Control no-store.
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/csrf'
      responses:
        '201':
          description: First enrollment
          headers:
            Location:
              schema: {type: string}
              description: /api/v1/me/participations/{participationId}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Participation'}
        '200':
          description: Existing enrollment, with original snapshot and timestamps
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Participation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: csrf_invalid (may precede authentication) or self_enrollment_forbidden
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: quest_not_joinable for the creator's own nonpublished quest
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '500': {$ref: '#/components/responses/IntegrityError'}
  /participations/{id}/complete:
    post:
      summary: Permanently complete an owned participation and award XP exactly once
      description: Self-reported completion; no body or If-Match. Owner-scoped row lock and one transaction for status plus ledger. Archived Quests remain completable. Retries preserve completion and award timestamps. Cache-Control no-store. Missing/mismatched ledger is an integrity error, never repaired by another award.
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/csrf'
      responses:
        '200':
          description: First or repeated completion with saved snapshot award
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Participation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: csrf_invalid (may precede authentication)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/IntegrityError'}
  /me/participations:
    get:
      summary: Owner-only participation history
      description: Includes archived Quests; scalar projection avoids N+1 reads. Ordered joinedAt DESC then id DESC. Cache-Control no-store. Filters combine with AND. Reject page*size above 2147483647.
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: status, in: query, schema: {type: string, enum: [IN_PROGRESS, COMPLETED]}}
        - {name: questId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Owner page, including empty results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ParticipationPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '500': {$ref: '#/components/responses/IntegrityError'}
  /me/participations/{id}:
    get:
      summary: Owner-only participation details, including archived Quest summary
      description: Cache-Control no-store; missing and another user's records return the same 404.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Saved participation and current Quest summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Participation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/IntegrityError'}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-id
      description: Local HTTP uses sidequest-local-id; obtain a session through the authentication API.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    csrf:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema: {type: string}
  responses:
    BadRequest:
      description: invalid_parameter, invalid_pagination or unexpected_body
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthenticated:
      description: unauthenticated
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: not_found; includes inaccessible private resources
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    IntegrityError:
      description: integrity_error; generic response with no SQL or private identifiers
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    ParticipationPage:
      type: object
      required: [content, page, size, totalElements, totalPages, hasNext, hasPrevious]
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/Participation'}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
        hasNext: {type: boolean}
        hasPrevious: {type: boolean}
    Problem:
      type: object
      required: [type, title, status, detail, instance, code]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string}
    Participation:
      type: object
      required: [id, questId, status, rewardXp, joinedAt, completedAt, awardedXp, quest]
      properties:
        id: {type: string, format: uuid}
        questId: {type: string, format: uuid}
        status: {type: string, enum: [IN_PROGRESS, COMPLETED]}
        rewardXp: {type: integer, minimum: 1, maximum: 1000}
        joinedAt: {type: string, format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
        awardedXp: {type: integer, minimum: 0, maximum: 1000}
        quest:
          type: object
          required: [title, description, category, difficulty, status]
          properties:
            title: {type: string}
            description: {type: string}
            category: {type: string, enum: [ADVENTURE, CREATIVITY, FITNESS, LEARNING, FOOD, SOCIAL]}
            difficulty: {type: string, enum: [EASY, MEDIUM, HARD]}
            status: {type: string, enum: [DRAFT, PUBLISHED, ARCHIVED]}
