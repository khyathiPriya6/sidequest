name: SideQuest CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 + isolated PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Install local PostgreSQL binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
      - name: Run isolated PostgreSQL integration suite
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          # PostgreSQL binaries supplied by the runner can vary in major version.
          PG_BIN="$(pg_config --bindir)" bash backend/scripts/test-postgres.sh
  web:
    name: Web (Vitest + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
  mobile:
    name: Mobile (Expo + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Mobile has no committed lockfile yet; install (not npm ci).
      # M7 follow-up: commit a reproducible mobile lockfile and switch to npm ci.
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npx --no-install expo-doctor
