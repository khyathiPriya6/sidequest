server:
  port: ${SERVER_PORT:8080}
spring:
  config:
    import: optional:file:./.env.properties
  application:
    name: sidequest-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:${DATABASE_PORT:5432}/${DATABASE_NAME:sidequest}}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      cleanup-cron: '0 * * * * *'
logging:
  level:
    # PostgreSQL constraint diagnostics can contain the entire rejected row, including hashes.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
